name: HF token check
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Prune HF history (keep newest 3 + latest)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "apunlegendhai/supabase-backup"
          info = api.repo_info(repo, repo_type="dataset", files_metadata=True)
          hist = sorted(
              [s for s in (info.siblings or []) if (s.rfilename or "").startswith("history/")],
              key=lambda s: s.rfilename,
          )
          keep = {s.rfilename for s in hist[-3:]}
          delete = [s.rfilename for s in hist if s.rfilename not in keep]
          print(f"history files: {len(hist)}; keeping newest {len(keep)}; deleting {len(delete)}")
          for i in range(0, len(delete), 50):
              api.delete_files(repo_id=repo, repo_type="dataset", delete_patterns=[p for p in delete[i:i+50]], commit_message="Quota cleanup: prune old history snapshots")
              print(f"  deleted batch {i//50 + 1} ({min(50, len(delete)-i)} files)")
          info2 = api.repo_info(repo, repo_type="dataset", files_metadata=True)
          tot = sum((s.size or 0) for s in (info2.siblings or []))
          print(f"after cleanup: {len(info2.siblings or [])} files, {tot/1e9:.2f} GB")
          PY
