name: HF token check
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: HF quota + vault contents
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 /tmp/qc.py 2>&1 || true
          python3 - <<'PY'
          import os, urllib.request, json
          req = urllib.request.Request("https://huggingface.co/api/users/apunlegendhai/quota",
                headers={"Authorization": "Bearer " + os.environ["HF_TOKEN"]})
          try:
              print(urllib.request.urlopen(req).read().decode()[:1500])
          except Exception as e:
              print("quota endpoint failed:", e)
          PY
