name: HF token check
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: HF vault inventory
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "apunlegendhai/supabase-backup"
          try:
              info = api.repo_info(repo, repo_type="dataset", files_metadata=True)
              sibs = list(info.siblings or [])
              tot = sum((s.size or 0) for s in sibs)
              hist = [s for s in sibs if (s.rfilename or "").startswith("history/")]
              hist_size = sum((s.size or 0) for s in hist)
              print(f"vault files: {len(sibs)} | total stored: {tot/1e9:.2f} GB")
              print(f"history snapshots: {len(hist)} | history stored: {hist_size/1e9:.2f} GB")
              latest = [s for s in sibs if (s.rfilename or "").startswith("latest/")]
              for s in latest:
                  print(f"  latest/{s.rfilename.split('/',1)[1]}: {(s.size or 0)/1e6:.1f} MB")
          except Exception as e:
              print("inventory FAILED:", repr(e))
              resp = getattr(e, "response", None)
              if resp is not None:
                  print("  HTTP", resp.status_code, resp.text[:500])
          PY
