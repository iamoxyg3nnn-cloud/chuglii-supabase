name: HF vault shrink
on: workflow_dispatch
permissions: {}
jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - name: Delete history snapshots, keep latest only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "apunlegendhai/supabase-backup"
          info = api.repo_info(repo, repo_type="dataset", files_metadata=True)
          hist = [s.rfilename for s in (info.siblings or []) if (s.rfilename or "").startswith("history/")]
          print(f"deleting {len(hist)} history files...")
          for i in range(0, len(hist), 50):
              api.delete_files(repo_id=repo, repo_type="dataset",
                               delete_patterns=hist[i:i+50],
                               commit_message="Shrink vault to latest-only (free-tier quota)")
          info2 = api.repo_info(repo, repo_type="dataset", files_metadata=True)
          tot = sum((s.size or 0) for s in (info2.siblings or []))
          print(f"vault now: {len(info2.siblings or [])} files, {tot/1e6:.1f} MB")
          PY
