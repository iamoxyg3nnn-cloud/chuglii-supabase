name: Debug TOC filter
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pg_restore --list output for log_events entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download live-backup -R "$GITHUB_REPOSITORY" -p 'supabase-state.tar.zst' --clobber -O /tmp/a.tar.zst
          mkdir -p /tmp/x && cd /tmp/x
          tar -xf /tmp/a.tar.zst db-backups
          ls -la db-backups | head
          docker run --rm -v /tmp/x/db-backups:/d:ro supabase/postgres:17.6.1.136 pg_restore --list /d/db-00000001.d > /tmp/toc.txt || echo "pg_restore --list exited $? (output still usable)"
          echo "=== total lines: $(wc -l < /tmp/toc.txt)"
          echo "=== lines containing log_events:"
          grep -n 'log_events' /tmp/toc.txt | head -15
          echo "=== lines containing TABLE DATA log_events: $(grep -c 'TABLE DATA log_events' /tmp/toc.txt || true)"
          echo "=== after grep -v filter: $(grep -v 'TABLE DATA log_events' /tmp/toc.txt | wc -l) lines (orig $(wc -l < /tmp/toc.txt))"
