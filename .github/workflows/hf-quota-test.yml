name: HF quota test
on: workflow_dispatch
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tiny upload probe + vault size
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 - <<'PY'
          import os, tempfile
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "apunlegendhai/supabase-backup"
          info = api.repo_info(repo, repo_type="dataset", files_metadata=True)
          tot = sum((s.size or 0) for s in (info.siblings or []))
          print(f"vault currently holds: {len(info.siblings or [])} files, {tot/1e9:.2f} GB")
          with tempfile.NamedTemporaryFile(suffix=".txt", delete=False) as f:
              f.write(b"quota-probe")
              p = f.name
          try:
              api.upload_file(path_or_fileobj=p, path_in_repo="quota-probe.txt",
                              repo_id=repo, repo_type="dataset", commit_message="quota probe")
              print("PROBE RESULT: upload OK — quota has free space again (GC settled)")
              api.delete_file(path_in_repo="quota-probe.txt", repo_id=repo, repo_type="dataset",
                              commit_message="remove quota probe")
          except Exception as e:
              msg = str(e)
              print("PROBE RESULT: upload FAILED:", msg[:300])
              resp = getattr(e, "response", None)
              if resp is not None:
                  print("  HTTP", resp.status_code, resp.text[:300])
          PY
